<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Chamados - Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4 text-center text-primary">🎫 Helpdesk Central</h1>

    <ul class="nav nav-tabs mb-4" id="helpdeskTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active fw-bold" id="fila-tab" data-bs-toggle="tab" data-bs-target="#fila" type="button" role="tab">🛠️ Fila de Chamados</button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold" id="novo-chamado-tab" data-bs-toggle="tab" data-bs-target="#novo-chamado" type="button" role="tab">➕ Abrir Chamado</button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold" id="cadastro-tab" data-bs-toggle="tab" data-bs-target="#cadastro" type="button" role="tab">👤 Cadastrar Usuário</button>
        </li>
    </ul>

    <div class="tab-content" id="helpdeskTabsContent">

        <div class="tab-pane fade show active" id="fila" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Chamados Aguardando Atendimento</h3>
                <span class="badge bg-primary fs-6" th:text="${chamados.size()} + ' na fila'">0 na fila</span>
            </div>

            <div th:if="${#lists.isEmpty(chamados)}" class="alert alert-success text-center">
                🎉 Excelente! Nenhum chamado na fila.
            </div>

            <div th:if="${!#lists.isEmpty(chamados)}" class="card shadow-sm">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Categoria</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Cliente</th>
                        <th>Técnico que vai Aceitar</th>
                        <th class="text-center">Ação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="chamado : ${chamados}">
                        <td th:text="${chamado.id}" class="fw-bold">1</td>
                        <td><span class="badge bg-secondary" th:text="${chamado.categoria}">IMPRESSORA</span></td>
                        <td th:text="${chamado.titulo}">Título</td>
                        <td>
                                    <span th:classappend="${chamado.prioridade.name() == 'ALTA' ? 'bg-danger' : (chamado.prioridade.name() == 'MEDIA' ? 'bg-warning text-dark' : 'bg-info')}"
                                          class="badge" th:text="${chamado.prioridade}">MEDIA</span>
                        </td>
                        <td th:text="${chamado.cliente.nome}">Cliente</td>

                        <form th:action="@{/painel-fila/assumir}" method="post">
                            <input type="hidden" name="chamadoId" th:value="${chamado.id}"/>
                            <td>
                                <select name="tecnicoId" class="form-select form-select-sm" required>
                                    <option value="">Selecione um Técnico...</option>
                                    <option th:each="u : ${usuarios}" th:if="${u.perfil.name() == 'TECNICO'}" th:value="${u.id}" th:text="${u.nome}"></option>
                                </select>
                            </td>
                            <td class="text-center">
                                <button type="submit" class="btn btn-sm btn-success">⚡ Aceitar Chamado</button>
                            </td>
                        </form>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="tab-pane fade" id="novo-chamado" role="tabpanel">
            <div class="card shadow-sm mx-auto" style="max-width: 600px;">
                <div class="card-header bg-primary text-white"><h5 class="mb-0">Registrar Novo Chamado</h5></div>
                <div class="card-body">
                    <form th:action="@{/painel-fila/novo-chamado}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Quem está abrindo? (Cliente)</label>
                            <select name="clienteId" class="form-select" required>
                                <option value="">Selecione o Cliente...</option>
                                <option th:each="u : ${usuarios}" th:if="${u.perfil.name() == 'CLIENTE'}" th:value="${u.id}" th:text="${u.nome}"></option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Categoria</label>
                                <select name="categoria" class="form-select">
                                    <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="form-label">Prioridade</label>
                                <select name="prioridade" class="form-select">
                                    <option th:each="prio : ${prioridades}" th:value="${prio}" th:text="${prio}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Título do Problema</label>
                            <input type="text" name="titulo" class="form-control" placeholder="Ex: Impressora atolando papel" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição Detalhada</label>
                            <textarea name="descricao" class="form-control" rows="3" placeholder="Descreva o que aconteceu..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar Chamado para a Fila</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="cadastro" role="tabpanel">
            <div class="card shadow-sm mx-auto" style="max-width: 500px;">
                <div class="card-header bg-dark text-white"><h5 class="mb-0">Cadastrar Novo Usuário no Sistema</h5></div>
                <div class="card-body">
                    <form th:action="@{/painel-fila/novo-usuario}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" name="nome" class="form-control" placeholder="Nome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" placeholder="exemplo@empresa.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" placeholder="Senha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Perfil de Acesso</label>
                            <select name="perfil" class="form-select">
                                <option th:each="perf : ${perfis}" th:value="${perf}" th:text="${perf}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Salvar Cadastro</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
