<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Chamados - Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white rounded shadow-sm">
        <div>
            <h1 class="h4 mb-0 text-primary">🎫 Helpdesk Central</h1>
            <p class="mb-0 text-muted" sec:authorize="isAuthenticated()">
                Bem-vindo(a), <strong sec:authentication="principal.username"></strong>!
                (<span sec:authentication="principal.authorities[0]"></span>)
            </p>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Sair</button>
        </form>
    </div>

    <!-- Dashboards -->
    <div sec:authorize="hasAuthority('CLIENTE')" class="row mb-4">
        <!-- Conteúdo do dashboard do cliente -->
    </div>
    <div sec:authorize="hasAuthority('ADMIN')" class="row mb-4">
        <!-- Conteúdo do dashboard do admin -->
    </div>

    <!-- Abas de Navegação -->
    <ul class="nav nav-tabs mb-4" id="helpdeskTabs" role="tablist">
        <li class="nav-item" role="presentation" sec:authorize="hasAnyAuthority('TECNICO', 'ADMIN')">
            <button class="nav-link active fw-bold" id="fila-tab" data-bs-toggle="tab" data-bs-target="#fila" type="button" role="tab">
                Fila de Chamados <span class="badge bg-danger" th:text="${chamados != null ? #lists.size(chamados) : 0}"></span>
            </button>
        </li>
        <li class="nav-item" role="presentation" sec:authorize="hasAnyAuthority('TECNICO', 'ADMIN')">
            <button class="nav-link fw-bold" id="andamento-tab" data-bs-toggle="tab" data-bs-target="#andamento" type="button" role="tab">
                Em Andamento <span class="badge bg-warning text-dark" th:text="${chamadosEmAtendimento != null ? #lists.size(chamadosEmAtendimento) : 0}"></span>
            </button>
        </li>
        <li class="nav-item" role="presentation" sec:authorize="hasAuthority('CLIENTE')">
            <button class="nav-link active fw-bold" id="meus-chamados-tab" data-bs-toggle="tab" data-bs-target="#meus-chamados" type="button" role="tab">
                Meus Chamados
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" sec:authorize="!hasAuthority('CLIENTE')" id="historico-tab" data-bs-toggle="tab" data-bs-target="#historico" type="button" role="tab">
                Histórico (Resolvidos)
            </button>
        </li>
        <li class="nav-item ms-auto" role="presentation" sec:authorize="hasAuthority('CLIENTE')">
            <button class="nav-link" id="novo-chamado-tab" data-bs-toggle="tab" data-bs-target="#novo-chamado" type="button" role="tab">➕ Abrir Chamado</button>
        </li>
        <li class="nav-item" role="presentation" sec:authorize="hasAuthority('ADMIN')">
            <button class="nav-link" id="cadastro-tab" data-bs-toggle="tab" data-bs-target="#cadastro" type="button" role="tab">👤 Gerenciar Usuários</button>
        </li>
    </ul>

    <!-- Conteúdo das Abas -->
    <div class="tab-content" id="helpdeskTabsContent">
        <!-- Fila de Chamados -->
        <div class="tab-pane fade" sec:classappend="${#authorization.expression('hasAnyAuthority(''TECNICO'', ''ADMIN'')') ? 'show active' : ''}" id="fila" role="tabpanel">
            <!-- Conteúdo da fila -->
        </div>

        <!-- Em Andamento -->
        <div class="tab-pane fade" id="andamento" role="tabpanel">
            <!-- Conteúdo em andamento -->
        </div>

        <!-- Meus Chamados (Cliente) -->
        <div class="tab-pane fade" sec:classappend="${#authorization.expression('hasAuthority(''CLIENTE'')') ? 'show active' : ''}" id="meus-chamados" role="tabpanel">
            <!-- Conteúdo meus chamados -->
        </div>

        <!-- Histórico (Resolvidos) -->
        <div class="tab-pane fade" id="historico" role="tabpanel">
            <!-- Conteúdo histórico -->
        </div>

        <!-- Abrir Chamado (Cliente) -->
        <div class="tab-pane fade" id="novo-chamado" role="tabpanel">
            <!-- Conteúdo novo chamado -->
        </div>

        <!-- Gerenciar Usuários (Admin) -->
        <div class="tab-pane fade" id="cadastro" role="tabpanel">
            <!-- Conteúdo gerenciar usuários -->
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
