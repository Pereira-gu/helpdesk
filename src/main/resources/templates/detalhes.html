<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Chamado - Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .timeline {
            position: relative;
            padding-left: 30px;
            list-style: none;
        }
        .timeline:before {
            content: '';
            background: #dee2e6;
            display: inline-block;
            position: absolute;
            left: 11px;
            width: 2px;
            top: 0;
            height: 100%;
            z-index: 400;
        }
        .timeline-item {
            position: relative;
            margin: 20px 0;
        }
        .timeline-item:before {
            content: '';
            background: #fff;
            border: 3px solid #0d6efd;
            display: inline-block;
            position: absolute;
            border-radius: 50%;
            left: -24px;
            width: 14px;
            height: 14px;
            z-index: 400;
            top: 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="mb-3">
        <a href="/painel-fila" class="btn btn-sm btn-outline-secondary">&larr; Voltar para a Fila</a>
    </div>

    <!-- Alertas de Sucesso/Erro -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row">
        <!-- Detalhes do Chamado -->
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Chamado #<span th:text="${chamado.id}">1</span></h5>
                </div>
                <div class="card-body">
                    <h4 class="card-title text-primary" th:text="${chamado.titulo}">Título</h4>
                    <p class="card-text"><strong class="d-block text-muted">Descrição:</strong> <span th:text="${chamado.descricao}">Descrição detalhada...</span></p>
                    <hr>
                    <div class="row text-center">
                        <div class="col-6 mb-2">
                            <span class="d-block text-muted small fw-bold">STATUS</span>
                            <span class="badge bg-warning text-dark fs-6" th:text="${chamado.status}">ABERTO</span>
                        </div>
                        <div class="col-6 mb-2">
                            <span class="d-block text-muted small fw-bold">PRIORIDADE</span>
                            <span class="badge bg-danger fs-6" th:text="${chamado.prioridade}">ALTA</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulário de Interação -->
            <div class="card shadow-sm" th:if="${chamado.status.name() != 'RESOLVIDO'}">
                <div class="card-header bg-dark text-white"><h5>Atualizar Chamado</h5></div>
                <div class="card-body">
                    <form th:action="@{/painel-fila/chamado/{id}/comentar(id=${chamado.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Mensagem / Solução</label>
                            <textarea name="texto" class="form-control" rows="3" placeholder="Digite um comentário ou a solução técnica se for encerrar..." required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" name="resolver" value="false" class="btn btn-secondary w-50">Adicionar Comentário</button>
                            <button type="submit" name="resolver" value="true" class="btn btn-success w-50" th:if="${chamado.status.name() == 'EM_ATENDIMENTO'}">Resolver Chamado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Linha do Tempo (Timeline) -->
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Histórico & Linha do Tempo</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(historico)}" class="text-center text-muted">
                        Nenhuma interação registrada até o momento.
                    </div>
                    <ul class="timeline" th:if="${!#lists.isEmpty(historico)}">
                        <li class="timeline-item" th:each="hist : ${historico}">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong class="text-dark" th:text="${hist.usuario.nome}">Nome do Usuário</strong>
                                <span class="text-muted small" th:text="${#temporals.format(hist.dataRegistro, 'dd/MM/yyyy HH:mm')}">19/07/2026 12:00</span>
                            </div>
                            <p class="text-secondary bg-white p-2 rounded border border-light shadow-xs mb-0" th:text="${hist.descricao}">
                                Texto descritivo do histórico ou comentário enviado.
                            </p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
